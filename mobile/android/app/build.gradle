apply plugin: 'com.android.application'

// ABIs empacotadas. Padrão: só arm64-v8a (celulares atuais), o que deixa o APK bem menor
// (Python + ffmpeg são grandes). Para emulador: ./gradlew assembleDebug -PvitrolaAbis=arm64-v8a,x86_64
def vitrolaAbis = (project.findProperty('vitrolaAbis') ?: 'arm64-v8a').toString().split(',').collect { it.trim() }

// Versão do APK = "version" de mobile/package.json (o `make release` sobe junto com api/ e frontend/).
// versionCode = major * 1.000.000 + minor * 1.000 + patch: cresce a cada versão, como o Android exige.
def vitrolaVersionName = new groovy.json.JsonSlurper().parse(file('../../package.json')).version.toString()
def vitrolaVersionParts = (vitrolaVersionName =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!vitrolaVersionParts.find()) throw new GradleException("Versão inválida em mobile/package.json: ${vitrolaVersionName}")
def vitrolaVersionCode = vitrolaVersionParts.group(1).toInteger() * 1000000 + vitrolaVersionParts.group(2).toInteger() * 1000 + vitrolaVersionParts.group(3).toInteger()

// Assinatura do release (CI: secrets do GitHub). Sem VITROLA_KEYSTORE, o assembleRelease sai sem assinatura.
// O Android só instala uma atualização assinada com a mesma chave da versão instalada.
def vitrolaKeystore = System.getenv('VITROLA_KEYSTORE')

android {
    namespace = "app.vitrola.music"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.vitrola.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vitrolaVersionCode
        versionName vitrolaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters.addAll(vitrolaAbis)
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packaging {
        jniLibs {
            // A youtubedl-android executa Python/ffmpeg a partir de nativeLibraryDir:
            // as bibliotecas precisam ser extraídas na instalação.
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        if (vitrolaKeystore) {
            release {
                storeFile file(vitrolaKeystore)
                storePassword System.getenv('VITROLA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VITROLA_KEY_ALIAS')
                keyPassword System.getenv('VITROLA_KEY_PASSWORD') ?: System.getenv('VITROLA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (vitrolaKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // yt-dlp (com Python embarcado) e ffmpeg/ffprobe para Android.
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroidVersion"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroidVersion"
    // Seletor de saída de áudio do sistema ("Tocar em"), com as diferenças entre versões do Android.
    implementation "androidx.mediarouter:mediarouter:$androidxMediaRouterVersion"
    // Sessão de mídia nativa: carro (Bluetooth/AVRCP), notificação e tela de bloqueio.
    implementation "androidx.media:media:$androidxMediaVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
