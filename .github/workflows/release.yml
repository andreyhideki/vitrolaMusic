# Gera uma versão: o push de uma tag vX.Y.Z (criada pelo `make release VERSION=X.Y.Z`)
# testa, gera o APK de release assinado e publica um GitHub Release com o APK anexado.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    keystore em base64 (base64 -w0 minha.keystore)
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore
#   ANDROID_KEY_ALIAS          alias da chave
#   ANDROID_KEY_PASSWORD       senha da chave (opcional: usa a do keystore)
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: APK e GitHub Release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Conferir a versão dos package.json
        run: |
          expected="${VERSION#v}"
          for dir in api frontend mobile; do
            actual="$(node -p "require('./$dir/package.json').version")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$dir/package.json está em $actual, mas a tag é $VERSION. Use make release VERSION=$expected."
              exit 1
            fi
          done

      - name: Conferir os secrets de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error::Configure os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS (ver o README, seção Versões)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci --prefix mobile

      - name: Typecheck e testes
        run: |
          npm run typecheck --prefix mobile
          npm test --prefix mobile

      - name: Build web e cap sync
        working-directory: mobile
        run: |
          npx vite build
          npx cap sync android

      - name: Gerar o APK assinado
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VITROLA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VITROLA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VITROLA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VITROLA_KEYSTORE="$RUNNER_TEMP/vitrola.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$VITROLA_KEYSTORE"
          # O script gradlew não é versionado (.gitignore): roda o wrapper direto pelo jar.
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \
            assembleRelease --no-daemon --stacktrace
          rm -f "$VITROLA_KEYSTORE"

      - name: Preparar os arquivos
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/vitrola-music-$VERSION.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -l out

      - name: Publicar o GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease);; esac
          gh release create "$VERSION" out/* \
            --title "Vitrola Music $VERSION" \
            --generate-notes --verify-tag "${flags[@]}"
