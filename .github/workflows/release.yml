# Gera o APK de uma versão e anexa ao GitHub Release.
# - Automático: o release-please.yml chama este workflow quando o PR de versão entra na main.
# - Manual: push de uma tag vX.Y.Z criada pelo `make release VERSION=X.Y.Z` (ex.: pré-releases).
#
# Secrets necessários (Settings → Secrets and variables → Actions → Repository secrets):
#   ANDROID_KEYSTORE_BASE64    keystore em base64 (base64 -w0 minha.keystore)
#   ANDROID_KEYSTORE_PASSWORD  senha do keystore
#   ANDROID_KEY_ALIAS          alias da chave
#   ANDROID_KEY_PASSWORD       senha da chave (opcional: usa a do keystore)
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Tag da versão (vX.Y.Z)
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: APK e GitHub Release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Conferir a versão dos package.json
        run: |
          expected="${VERSION#v}"
          for dir in api frontend mobile; do
            actual="$(node -p "require('./$dir/package.json').version")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$dir/package.json está em $actual, mas a tag é $VERSION. Use make release VERSION=$expected."
              exit 1
            fi
          done

      - id: build
        uses: ./.github/actions/build-apk
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Preparar os arquivos
        env:
          APK: ${{ steps.build.outputs.apk }}
        run: |
          mkdir -p out
          cp "$APK" "out/vitrola-music-$VERSION.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -l out

      # O release-please já cria o release (com as notas do CHANGELOG): aí só anexa o APK.
      # No push manual de tag, cria o release com notas geradas a partir dos commits.
      - name: Publicar no GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" out/* --clobber
          else
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease);; esac
            gh release create "$VERSION" out/* \
              --title "Vitrola Music $VERSION" \
              --generate-notes --verify-tag "${flags[@]}"
          fi
