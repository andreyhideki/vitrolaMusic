# Verificação a cada push/PR: tipos e testes de api/, frontend/ e mobile/
# (o mesmo que make typecheck, make test e make mobile-test/mobile-typecheck).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: API e frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependências
        run: |
          npm ci --prefix api
          npm ci --prefix frontend
      - name: Typecheck da API
        run: npm run typecheck --prefix api
      - name: Typecheck do frontend
        run: npm run typecheck --prefix frontend
      - name: Testes do frontend
        run: npm test --prefix frontend

  mobile:
    name: APK (código JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - name: Typecheck do mobile
        run: npm run typecheck --prefix mobile
      - name: Testes do mobile
        run: npm test --prefix mobile

  # APK de teste para PRs: assinado com a mesma chave dos releases (instala por cima do app),
  # anexado como artefato do workflow. PRs de forks não recebem os secrets: o job é pulado.
  apk:
    name: APK de teste
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/build-apk
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Nome do artefato
        id: name
        run: echo "name=vitrola-music-pr${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.build.outputs.apk }}
          retention-days: 14
          if-no-files-found: error
